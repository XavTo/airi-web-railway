name: Publish AIRI Web image

on:
  workflow_dispatch:
    inputs:
      airi_version:
        description: "AIRI Docker tag, for example 0.10.2 or 0.11.3"
        required: true
        default: "0.10.2"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER}/airi-web-railway" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish wrapper image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            AIRI_VERSION=${{ inputs.airi_version }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.airi_version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.title=AIRI Web for Railway
            org.opencontainers.image.description=Railway-ready browser edition of Project AIRI
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
