name: Publish AIRI Web image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/xavto/airi-web-railway
  AIRI_REF: v0.11.3
  IMAGE_TAG: 0.11.3

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish AIRI Web
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            AIRI_REF=${{ env.AIRI_REF }}
            VITE_ENABLE_POSTHOG=false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=AIRI Web for Railway
            org.opencontainers.image.description=Railway-ready browser edition of Project AIRI
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
  
  publish-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          platforms: linux/amd64
          build-args: |
            AIRI_REF=v0.11.3
          tags: |
            ghcr.io/xavto/airi-server-railway:0.11.3
            ghcr.io/xavto/airi-server-railway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          
  publish-postgres:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.postgres
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/xavto/airi-postgres-railway:0.11.3
            ghcr.io/xavto/airi-postgres-railway:latest
          provenance: false
